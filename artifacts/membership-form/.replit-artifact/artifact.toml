kind = "web"
previewPath = "/"
title = "BWYDC Membership Application"
description = "A digital membership application for Bong County Women and Youth Development Cooperation members."
version = "1.0.0"
id = "artifacts/membership-form"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19033

[services.development]
run = "pnpm --filter @workspace/membership-form run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/membership-form", "run", "build" ]
serve = "static"
publicDir = "artifacts/membership-form/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19033"
BASE_PATH = "/"
